.pager button:disabled{opacity:.3;pointer-events:none;}
.pager span{font-size:13px;color:var(--sub);}
.tip{text-align:center;color:#666;font-size:11px;padding:10px;}

var PAGE_SIZE = 100;
var CATS = DATA.cats;
var cur = 0;
var page = 0;

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function play(s){
    var fmw = (window.fm && window.fm.play) ? window.fm : null;
    var url = 'https://www.hanmaidj.cn/play/' + s.id;
    if(fmw){ fmw.play(url, s.title, s.singer||''); return; }
    var old = document.getElementById('pif'); if(old) old.remove();
    var f = document.createElement('iframe');
    f.id='pif'; f.src=url; f.style.display='none'; document.body.appendChild(f);
}

function playByIdx(c,i){ play(CATS[c].songs[i]); }

function renderList(){
    var box = document.getElementById('list');
    var songs = CATS[cur].songs;
    var totalPages = Math.max(1, Math.ceil(songs.length / PAGE_SIZE));
    if(page >= totalPages) page = totalPages - 1;
    var start = page * PAGE_SIZE;
    var end = Math.min(start + PAGE_SIZE, songs.length);
    var html = '';
    for(var i=start; i<end; i++){
        var s = songs[i];
        var idx = (i+1) < 10 ? '0'+(i+1) : (i+1);
        html += '<div class="row" onclick="playByIdx('+cur+','+i+')">'
             +  '<div class="no">'+idx+'</div>'
             +  '<div class="info"><h3>'+esc(s.title)+'</h3>'
             +  '<p>'+esc(s.singer||'未知')+' · 320Kbps</p></div>'
             +  '<button class="pb" onclick="event.stopPropagation();playByIdx('+cur+','+i+')">播放</button>'
             +  '</div>';
    }
    box.innerHTML = html;
    document.getElementById('listCount').textContent =
        CATS[cur].name + ' 第' + (page+1) + '/' + totalPages + '页 (共 ' + songs.length + ' 首)';
    var pg = document.getElementById('pager');
    pg.innerHTML = '<button onclick="prevPage()" ' + (page<=0?'disabled':'') + '>上一页</button>'
                 + '<span>' + (page+1) + ' / ' + totalPages + '</span>'
                 + '<button onclick="nextPage()" ' + (page>=totalPages-1?'disabled':'') + '>下一页</button>';
}

function prevPage(){
    if(page <= 0) return;
    page--;
    renderList();
    window.scrollTo(0,0);
}

function nextPage(){
    var songs = CATS[cur].songs;
    var totalPages = Math.ceil(songs.length / PAGE_SIZE);
    if(page >= totalPages-1) return;
    page++;
    renderList();
    window.scrollTo(0,0);
}

function renderTabs(){
    var t = document.getElementById('tabs');
    t.innerHTML = CATS.map(function(c,i){
        return '<span class="'+(i===cur?'on':'')+'" onclick="switchCat('+i+')">'+esc(c.name)+'</span>';
    }).join('');
}

function switchCat(i){
    cur = i;
    page = 0;
    renderTabs(); renderList(); window.scrollTo(0,0);
}

function doSearch(){
    var kw = document.getElementById('kw').value.trim();
    if(kw) location.href = 'https://www.hanmaidj.cn/search?key=' + encodeURIComponent(kw);
}

renderTabs(); renderList();
</script>
